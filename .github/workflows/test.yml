name: Headless tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-tests:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install OpenCV runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1

      - name: Run local CI script
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: ./scripts/ci-local.sh

  main-gate:
    name: Python 3.12 (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install OpenCV runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1

      - name: Run local CI script
        env:
          PYTHON_VERSION: "3.12"
        run: ./scripts/ci-local.sh
