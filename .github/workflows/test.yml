name: Headless tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Install OpenCV runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1

      - name: Run focused headless tests
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest -q
          tests/test_ipc.py tests/test_sc2env.py tests/test_incredibot.py
