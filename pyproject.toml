[project]
name = "starcraft2bot"
version = "0.1.0"
description = "A StarCraft II bot and RL training environment."
authors = [{name = "Your Name", email = "your@email.com"}]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "sc2",
  "opencv-python",
  "numpy",
  "gymnasium",
  "stable-baselines3",
  "wandb",
  "torch",
  "tensorboard",
  "shimmy>=2.0",
  "protobuf>=3.20.0,<3.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy"
]