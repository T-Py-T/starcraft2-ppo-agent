[project]
name = "starcraft2-ppo-agent"
version = "0.1.0"
description = "PPO training environment and process-safe Protoss agent for StarCraft II"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "burnysc2>=7.3.0,<8",
  "opencv-python",
  "numpy",
  "gymnasium",
  "stable-baselines3",
  "wandb",
  "torch",
  "tensorboard",
  "shimmy>=2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy"
]
